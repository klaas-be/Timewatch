name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Timewatch.slnx --configuration Release

      # Every push to main yields an installable version, so no version string is ever
      # edited by hand. Pull requests stop after the test step.
      - name: Work out the version
        if: github.event_name != 'pull_request'
        id: version
        run: echo "version=0.1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Package with jprm
        if: github.event_name != 'pull_request'
        run: |
          pip install --quiet jprm
          mkdir -p artifacts
          jprm plugin build . --version="${{ steps.version.outputs.version }}"

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "artifacts/timewatch_$VERSION.zip" \
            --title "v$VERSION" \
            --notes "Automated build of ${{ github.sha }}."

      # The plugin repository manifest Jellyfin polls. Served straight from the raw
      # github URL, so it is live the moment this push lands.
      - name: Update the repository manifest
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHECKSUM="$(cut -d' ' -f1 < "artifacts/timewatch_$VERSION.zip.md5sum")"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/timewatch_$VERSION.zip"
          TIMESTAMP="$(jq -r .timestamp < "artifacts/timewatch_$VERSION.zip.meta.json")"
          TARGET_ABI="$(jq -r .targetAbi < "artifacts/timewatch_$VERSION.zip.meta.json")"
          CHANGELOG="$(jq -r .changelog < "artifacts/timewatch_$VERSION.zip.meta.json")"

          jq --arg version "$VERSION" \
             --arg checksum "$CHECKSUM" \
             --arg sourceUrl "$SOURCE_URL" \
             --arg timestamp "$TIMESTAMP" \
             --arg targetAbi "$TARGET_ABI" \
             --arg changelog "$CHANGELOG" \
             '.[0].versions |= ([{
                 version: $version,
                 changelog: $changelog,
                 targetAbi: $targetAbi,
                 sourceUrl: $sourceUrl,
                 checksum: $checksum,
                 timestamp: $timestamp
               }] + .)' manifest.json > manifest.json.new
          mv manifest.json.new manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish v$VERSION [skip ci]"
          git push
